<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Racket Compare</title>
  <meta name="description" content="Browse tennis racket specs and compare rackets side by side.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1><a href="#">Racket Compare</a></h1>
    <p class="tag">Browse tennis racket specs and compare rackets side by side.</p>
  </header>

  <main>
    <section id="browse">
      <div class="controls">
        <input id="q" type="search" placeholder="Search brand or model…" aria-label="Search">
        <select id="brand" aria-label="Brand"><option value="">All brands</option></select>
        <select id="head" aria-label="Head size">
          <option value="">Any head size</option>
          <option value="0-97">≤ 97 sq in</option>
          <option value="98-99">98–99 sq in</option>
          <option value="100-200">≥ 100 sq in</option>
        </select>
        <select id="sort" aria-label="Sort">
          <option value="brand">Sort: Brand</option>
          <option value="weight">Sort: Weight</option>
          <option value="headSize">Sort: Head size</option>
          <option value="swingweight">Sort: Swing weight</option>
          <option value="stiffness">Sort: Stiffness</option>
          <option value="balance">Sort: Balance</option>
        </select>
      </div>
      <p id="count" class="muted"></p>
      <div id="grid" class="grid"></div>
    </section>

    <section id="compare" hidden>
      <div class="compare-head">
        <h2>Compare</h2>
        <label class="toggle"><input id="diffOnly" type="checkbox"> Differences only</label>
        <button id="back" class="btn ghost" type="button">← Back to list</button>
      </div>
      <div class="table-wrap"><table id="table"></table></div>
    </section>
  </main>

  <div id="tray" class="tray" hidden>
    <div id="trayItems" class="tray-items"></div>
    <div class="tray-actions">
      <button id="clear" class="btn ghost" type="button">Clear</button>
      <button id="go" class="btn" type="button">Compare</button>
    </div>
  </div>

  <dialog id="zoom" class="zoom" aria-labelledby="zoomTitle">
    <button id="zoomClose" class="zoom-close" type="button" aria-label="Close">×</button>
    <div id="zoomPic" class="zoom-pic"></div>
    <div class="zoom-caption">
      <h2 id="zoomTitle"></h2>
      <p id="zoomMeta" class="muted"></p>
    </div>
  </dialog>

  <footer class="muted">Current models, checked Nov 2026.<br>
    Specs and photos from each brand’s official site; “—” means the brand doesn’t publish that spec. Photos © their brands; rackets without one are drawn.</footer>

  <script src="data/rackets.js"></script>
  <script src="app.js"></script>
</body>
</html>
